name: check

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run repository check
        run: npm run check
      - name: Diagnostic browser render smoke
        id: browser-smoke
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-evidence
          python3 -m http.server 4173 --directory dist > browser-evidence/http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo "No Chrome/Chromium executable found on runner." >&2
            exit 2
          fi
          common_flags=(
            --headless=new
            --no-sandbox
            --disable-dev-shm-usage
            --use-angle=swiftshader
            --enable-unsafe-swiftshader
            --window-size=1440,900
            --hide-scrollbars
          )
          "$chrome" "${common_flags[@]}" --screenshot=browser-evidence/rig-default.png http://127.0.0.1:4173/
          "$chrome" "${common_flags[@]}" --screenshot=browser-evidence/map-workspace.png 'http://127.0.0.1:4173/?workspace=map'
          test -s browser-evidence/rig-default.png
          test -s browser-evidence/map-workspace.png
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ github.event.pull_request.head.sha }}
          path: browser-evidence
          if-no-files-found: warn
          retention-days: 3
      - name: Prepare Windows owner preview
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          rm -rf owner-preview
          mkdir -p owner-preview
          cp -R dist owner-preview/dist
          cat > owner-preview/preview-server.mjs <<'EOF'
          import { createServer } from 'node:http';
          import { readFile, stat } from 'node:fs/promises';
          import { extname, resolve, sep } from 'node:path';
          import { fileURLToPath } from 'node:url';
          import { spawn } from 'node:child_process';

          const root = resolve(fileURLToPath(new URL('./dist/', import.meta.url)));
          const port = Number(process.env.PORT || 4173);
          const host = '127.0.0.1';
          const contentTypes = new Map([
            ['.html', 'text/html; charset=utf-8'],
            ['.js', 'text/javascript; charset=utf-8'],
            ['.css', 'text/css; charset=utf-8'],
            ['.json', 'application/json; charset=utf-8'],
            ['.svg', 'image/svg+xml'],
            ['.png', 'image/png'],
            ['.jpg', 'image/jpeg'],
            ['.jpeg', 'image/jpeg'],
            ['.webp', 'image/webp'],
            ['.wasm', 'application/wasm'],
          ]);

          const server = createServer(async (request, response) => {
            try {
              const url = new URL(request.url ?? '/', `http://${host}:${port}`);
              const pathname = decodeURIComponent(url.pathname === '/' ? '/index.html' : url.pathname);
              const candidate = resolve(root, `.${pathname}`);
              if (candidate !== root && !candidate.startsWith(`${root}${sep}`)) {
                response.writeHead(403).end('Forbidden');
                return;
              }
              const info = await stat(candidate);
              if (!info.isFile()) throw new Error('Not a file');
              const body = await readFile(candidate);
              response.writeHead(200, {
                'Content-Type': contentTypes.get(extname(candidate).toLowerCase()) ?? 'application/octet-stream',
                'Cache-Control': 'no-store',
              });
              response.end(body);
            } catch {
              response.writeHead(404, { 'Content-Type': 'text/plain; charset=utf-8' });
              response.end('Not found');
            }
          });

          server.listen(port, host, () => {
            const url = `http://${host}:${port}/?workspace=map`;
            console.log(`JURE Map preview: ${url}`);
            console.log('Close this window or press Ctrl+C to stop the preview server.');
            if (process.platform === 'win32' && process.env.JURE_PREVIEW_NO_OPEN !== '1') {
              const child = spawn('cmd.exe', ['/c', 'start', '', url], { detached: true, stdio: 'ignore' });
              child.unref();
            }
          });
          EOF
          cat > owner-preview/START_MAP_PREVIEW.cmd <<'EOF'
          @echo off
          setlocal
          cd /d "%~dp0"
          where node >nul 2>nul
          if errorlevel 1 (
            echo Node.js was not found. Install Node.js, then run this file again.
            pause
            exit /b 1
          )
          node preview-server.mjs
          if errorlevel 1 pause
          EOF
          cat > owner-preview/README.txt <<EOF
          JURE Map Lab - World/Local Move/Rotate owner preview
          Source branch: agent/map-workspace-foundation
          Source head: ${HEAD_SHA}

          Box Face Resize V2 is already owner-PASS. This gate tests the next small Stage-1 slice only: World/Local orientation for Move and Rotate. Resize remains deliberately Local because World Resize semantics are not yet defined.

          Windows:
          1. Double-click START_MAP_PREVIEW.cmd.
          2. Select Ground slab or Bumper and enter Move. The transform-space control should start at World.
          3. Rotate the selected entity away from the world axes, then return to Move while World is active. The gizmo axes should remain aligned to world X/Y/Z.
          4. Toggle World -> Local. The Move gizmo axes should align to the entity's authored orientation. Move along one local axis and confirm the object follows that local direction.
          5. Repeat with Rotate: World and Local should visibly change the rotation gizmo orientation in the same way as the accepted Rig workspace.
          6. Toggle back and forth several times between World and Local while no drag is active. Undo/Redo and Esc cancellation for actual transforms should remain normal.
          7. Select Ground slab, choose Local, then enter Resize. The space control must display Local and be disabled because Resize is defined on authored local signed faces.
          8. Leave Resize for Move or Rotate. The previously selected Move/Rotate preference must return; e.g. Local -> Resize -> Move returns Local.
          9. Repeat the preference test from World: World -> Resize displays Local -> Move/Rotate returns World. This proves Resize did not overwrite the stored Move/Rotate preference.
          10. Quickly regression-check Face Resize V2 (opposite face fixed + Alt center), exact Dimensions, Bumper Resize non-support and Rig <-> Map navigation.
          11. Close the command window (or press Ctrl+C) to stop the preview server.

          Acceptance boundary: World/Local applies only to Move/Rotate. Do not interpret the disabled Local state in Resize as a missing implementation bug; World Resize remains an intentionally open geometry-semantics problem. Capsule axial/radial Resize is the next independent geometry slice after this gate.
          This artifact is a local preview only. It does not modify an existing JURE checkout.
          EOF
      - name: Smoke owner preview package
        shell: bash
        run: |
          set -euo pipefail
          PORT=4174 JURE_PREVIEW_NO_OPEN=1 node owner-preview/preview-server.mjs > owner-preview/server-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent 'http://127.0.0.1:4174/?workspace=map' > /dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent 'http://127.0.0.1:4174/?workspace=map' > /dev/null
          curl --fail --silent 'http://127.0.0.1:4174/assets/' > /dev/null || true
      - name: Upload owner preview
        uses: actions/upload-artifact@v4
        with:
          name: jure-map-owner-preview-${{ github.event.pull_request.head.sha }}
          path: owner-preview
          if-no-files-found: error
          retention-days: 7
