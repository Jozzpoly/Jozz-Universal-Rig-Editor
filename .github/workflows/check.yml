name: check

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run repository check
        run: npm run check
      - name: Diagnostic browser render smoke
        id: browser-smoke
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-evidence
          python3 -m http.server 4173 --directory dist > browser-evidence/http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo "No Chrome/Chromium executable found on runner." >&2
            exit 2
          fi
          common_flags=(
            --headless=new
            --no-sandbox
            --disable-dev-shm-usage
            --use-angle=swiftshader
            --enable-unsafe-swiftshader
            --window-size=1440,900
            --hide-scrollbars
          )
          "$chrome" "${common_flags[@]}" --screenshot=browser-evidence/rig-default.png http://127.0.0.1:4173/
          "$chrome" "${common_flags[@]}" --screenshot=browser-evidence/map-workspace.png 'http://127.0.0.1:4173/?workspace=map'
          test -s browser-evidence/rig-default.png
          test -s browser-evidence/map-workspace.png
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ github.event.pull_request.head.sha }}
          path: browser-evidence
          if-no-files-found: warn
          retention-days: 3
      - name: Prepare Windows owner preview
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          rm -rf owner-preview
          mkdir -p owner-preview
          cp -R dist owner-preview/dist
          cat > owner-preview/preview-server.mjs <<'EOF'
          import { createServer } from 'node:http';
          import { readFile, stat } from 'node:fs/promises';
          import { extname, resolve, sep } from 'node:path';
          import { fileURLToPath } from 'node:url';
          import { spawn } from 'node:child_process';

          const root = resolve(fileURLToPath(new URL('./dist/', import.meta.url)));
          const port = Number(process.env.PORT || 4173);
          const host = '127.0.0.1';
          const contentTypes = new Map([
            ['.html', 'text/html; charset=utf-8'],
            ['.js', 'text/javascript; charset=utf-8'],
            ['.css', 'text/css; charset=utf-8'],
            ['.json', 'application/json; charset=utf-8'],
            ['.svg', 'image/svg+xml'],
            ['.png', 'image/png'],
            ['.jpg', 'image/jpeg'],
            ['.jpeg', 'image/jpeg'],
            ['.webp', 'image/webp'],
            ['.wasm', 'application/wasm'],
          ]);

          const server = createServer(async (request, response) => {
            try {
              const url = new URL(request.url ?? '/', `http://${host}:${port}`);
              const pathname = decodeURIComponent(url.pathname === '/' ? '/index.html' : url.pathname);
              const candidate = resolve(root, `.${pathname}`);
              if (candidate !== root && !candidate.startsWith(`${root}${sep}`)) {
                response.writeHead(403).end('Forbidden');
                return;
              }
              const info = await stat(candidate);
              if (!info.isFile()) throw new Error('Not a file');
              const body = await readFile(candidate);
              response.writeHead(200, {
                'Content-Type': contentTypes.get(extname(candidate).toLowerCase()) ?? 'application/octet-stream',
                'Cache-Control': 'no-store',
              });
              response.end(body);
            } catch {
              response.writeHead(404, { 'Content-Type': 'text/plain; charset=utf-8' });
              response.end('Not found');
            }
          });

          server.listen(port, host, () => {
            const url = `http://${host}:${port}/?workspace=map`;
            console.log(`JURE Map preview: ${url}`);
            console.log('Close this window or press Ctrl+C to stop the preview server.');
            if (process.platform === 'win32' && process.env.JURE_PREVIEW_NO_OPEN !== '1') {
              const child = spawn('cmd.exe', ['/c', 'start', '', url], { detached: true, stdio: 'ignore' });
              child.unref();
            }
          });
          EOF
          cat > owner-preview/START_MAP_PREVIEW.cmd <<'EOF'
          @echo off
          setlocal
          cd /d "%~dp0"
          where node >nul 2>nul
          if errorlevel 1 (
            echo Node.js was not found. Install Node.js, then run this file again.
            pause
            exit /b 1
          )
          node preview-server.mjs
          if errorlevel 1 pause
          EOF
          cat > owner-preview/README.txt <<EOF
          JURE Map Lab - Face Resize V2 closeout owner preview
          Source branch: agent/map-workspace-foundation
          Source head: ${HEAD_SHA}

          This re-test is deliberately narrow. The previous owner test classified the underlying face-resize semantics as almost-PASS, but exposed two blockers: releasing Alt cancelled the live command on Windows/browser, and the six floating cube handles were too raw to read as a coherent gizmo.

          Windows:
          1. Double-click START_MAP_PREVIEW.cmd.
          2. Select Ground slab and enter Resize.
          3. Inspect the new control language before dragging: each signed face has a face plate, short axis stem and cube grip. Front controls should read strongly; controls on the far side should remain available but visibly ghosted.
          4. Drag one face without Alt. The opposite face should stay fixed. During the drag, the status bar should explicitly report e.g. '+X · ANCHORED · -X fixed', and the opposite face should receive a fixed-face visual cue.
          5. Without releasing the pointer, press and hold Alt. The SAME drag must switch to symmetric center-origin resize. The status should report 'CENTER symmetric (Alt)', the opposite control should read as a paired control, and a center cue should appear.
          6. Still holding the pointer, RELEASE Alt. This is the critical regression test: the command must NOT cancel or jump. It should return smoothly to ANCHORED from the same frozen baseline, with the status/fixed-face cue switching back accordingly.
          7. Repeat the Alt press/release cycle several times during one drag. No compounding, revision creation or cancellation should occur until pointer release.
          8. Press Esc during a separate active drag and confirm Esc still intentionally cancels pose + dimensions exactly. Pointer release should still commit; Undo/Redo should restore the committed snapshots.
          9. Rotate Ground slab and repeat face Resize. Controls should follow local authored faces and remain readable at ordinary camera angles.
          10. Judge the gizmo specifically: is the action direction obvious, is the dragged face relationship clear, are rear controls understandable rather than confusing, and do the anchored/center cues make the current meaning visible?
          11. Exact Dimensions X/Y/Z still intentionally preserve center. Bumper still has no fake Resize. Move/Rotate and Rig <-> Map navigation should remain intact.
          12. Close the command window (or press Ctrl+C) to stop the preview server.

          Current scope: closing the existing Box Face Resize V2 owner gate only. World/Local expansion, capsule Resize and the larger Rig/Map interface-unification stage remain intentionally blocked until this checkpoint is accepted.
          This artifact is a local preview only. It does not modify an existing JURE checkout.
          EOF
      - name: Smoke owner preview package
        shell: bash
        run: |
          set -euo pipefail
          PORT=4174 JURE_PREVIEW_NO_OPEN=1 node owner-preview/preview-server.mjs > owner-preview/server-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent 'http://127.0.0.1:4174/?workspace=map' > /dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent 'http://127.0.0.1:4174/?workspace=map' > /dev/null
          curl --fail --silent 'http://127.0.0.1:4174/assets/' > /dev/null || true
      - name: Upload owner preview
        uses: actions/upload-artifact@v4
        with:
          name: jure-map-owner-preview-${{ github.event.pull_request.head.sha }}
          path: owner-preview
          if-no-files-found: error
          retention-days: 7
