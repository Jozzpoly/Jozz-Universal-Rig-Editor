name: check

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run repository check
        run: npm run check
      - name: Diagnostic browser render smoke
        id: browser-smoke
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-evidence
          python3 -m http.server 4173 --directory dist > browser-evidence/http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo "No Chrome/Chromium executable found on runner." >&2
            exit 2
          fi
          common_flags=(
            --headless=new
            --no-sandbox
            --disable-dev-shm-usage
            --use-angle=swiftshader
            --enable-unsafe-swiftshader
            --window-size=1440,900
            --hide-scrollbars
          )
          "$chrome" "${common_flags[@]}" --screenshot=browser-evidence/rig-default.png http://127.0.0.1:4173/
          "$chrome" "${common_flags[@]}" --screenshot=browser-evidence/map-workspace.png 'http://127.0.0.1:4173/?workspace=map'
          test -s browser-evidence/rig-default.png
          test -s browser-evidence/map-workspace.png
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ github.event.pull_request.head.sha }}
          path: browser-evidence
          if-no-files-found: warn
          retention-days: 3
      - name: Prepare Windows owner preview
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          rm -rf owner-preview
          mkdir -p owner-preview
          cp -R dist owner-preview/dist
          cat > owner-preview/preview-server.mjs <<'EOF'
          import { createServer } from 'node:http';
          import { readFile, stat } from 'node:fs/promises';
          import { extname, resolve, sep } from 'node:path';
          import { fileURLToPath } from 'node:url';
          import { spawn } from 'node:child_process';

          const root = resolve(fileURLToPath(new URL('./dist/', import.meta.url)));
          const port = Number(process.env.PORT || 4173);
          const host = '127.0.0.1';
          const contentTypes = new Map([
            ['.html', 'text/html; charset=utf-8'],
            ['.js', 'text/javascript; charset=utf-8'],
            ['.css', 'text/css; charset=utf-8'],
            ['.json', 'application/json; charset=utf-8'],
            ['.svg', 'image/svg+xml'],
            ['.png', 'image/png'],
            ['.jpg', 'image/jpeg'],
            ['.jpeg', 'image/jpeg'],
            ['.webp', 'image/webp'],
            ['.wasm', 'application/wasm'],
          ]);

          const server = createServer(async (request, response) => {
            try {
              const url = new URL(request.url ?? '/', `http://${host}:${port}`);
              const pathname = decodeURIComponent(url.pathname === '/' ? '/index.html' : url.pathname);
              const candidate = resolve(root, `.${pathname}`);
              if (candidate !== root && !candidate.startsWith(`${root}${sep}`)) {
                response.writeHead(403).end('Forbidden');
                return;
              }
              const info = await stat(candidate);
              if (!info.isFile()) throw new Error('Not a file');
              const body = await readFile(candidate);
              response.writeHead(200, {
                'Content-Type': contentTypes.get(extname(candidate).toLowerCase()) ?? 'application/octet-stream',
                'Cache-Control': 'no-store',
              });
              response.end(body);
            } catch {
              response.writeHead(404, { 'Content-Type': 'text/plain; charset=utf-8' });
              response.end('Not found');
            }
          });

          server.listen(port, host, () => {
            const url = `http://${host}:${port}/?workspace=map`;
            console.log(`JURE Map preview: ${url}`);
            console.log('Close this window or press Ctrl+C to stop the preview server.');
            if (process.platform === 'win32' && process.env.JURE_PREVIEW_NO_OPEN !== '1') {
              const child = spawn('cmd.exe', ['/c', 'start', '', url], { detached: true, stdio: 'ignore' });
              child.unref();
            }
          });
          EOF
          cat > owner-preview/START_MAP_PREVIEW.cmd <<'EOF'
          @echo off
          setlocal
          cd /d "%~dp0"
          where node >nul 2>nul
          if errorlevel 1 (
            echo Node.js was not found. Install Node.js, then run this file again.
            pause
            exit /b 1
          )
          node preview-server.mjs
          if errorlevel 1 pause
          EOF
          cat > owner-preview/README.txt <<EOF
          JURE Map Lab - MAP-ENTITY-01 owner preview
          Source branch: agent/map-workspace-foundation
          Source head: ${HEAD_SHA}

          This gate tests one structural falsifier only: whether MapDocument behaves like a dynamically authored world rather than a fixed synthetic fixture. Duplicate/Delete must participate in the same authored identity and EditorSession history used by Move/Rotate/Resize.

          Windows:
          1. Double-click START_MAP_PREVIEW.cmd.
          2. Select Ground slab. Confirm the navigator starts with 2 entities and Duplicate/Delete are available while no drag preview is active.
          3. Click Duplicate. The navigator should become 3 entities and the new selected entity should be Ground slab copy 1 with authored ID entity.ground.copy.1. Its starting pose, box dimensions, visual intent and surface data should match Ground slab.
          4. Move and rotate the duplicate, then use signed-face Resize on it. Confirm only the duplicate changes and the original Ground slab remains unchanged.
          5. Click Delete while the duplicate is selected. The navigator should return to 2 entities, the selection/Inspector should clear safely and no stale transform or resize gizmo should remain attached.
          6. Click Undo. The edited duplicate must return with the exact same ID entity.ground.copy.1 and with its pre-delete Move/Rotate/Resize state intact.
          7. Click Redo. The duplicate must disappear again. Undo once more and confirm the same identity returns again.
          8. With entity.ground.copy.1 present, select the original Ground slab and click Duplicate again. The new identity should advance deterministically to entity.ground.copy.2 rather than collide with the existing copy.
          9. While entity.ground.copy.2 is selected, click Undo. That duplicate should disappear and selection must reconcile safely instead of pointing at a missing entity.
          10. Quick regression: Move/Rotate World/Local, Box Face Resize V2 including Alt center mode, exact Dimensions, Bumper capsule read-only Resize state and Rig <-> Map navigation should remain normal.
          11. Close the command window (or press Ctrl+C) to stop the preview server.

          Acceptance boundary:
          - PASS means structural Duplicate/Delete, deterministic non-colliding authored identity, normal history and safe selection reconciliation work in the real browser workflow.
          - The .copy.N allocator is intentionally provisional evidence infrastructure, not the final JURE identity/naming scheme.
          - This gate does not define Create UX, final entity taxonomy, persistence, final MapPackage, Capsule Resize or non-primitive representation.
          - MAP-PERSIST-01 should be reconsidered only after this structural lifecycle gate is accepted, so Save/Open is tested on a genuinely user-shaped MapDocument instead of only the original fixture.

          This artifact is a local preview only. It does not modify an existing JURE checkout.
          EOF
      - name: Smoke owner preview package
        shell: bash
        run: |
          set -euo pipefail
          PORT=4174 JURE_PREVIEW_NO_OPEN=1 node owner-preview/preview-server.mjs > owner-preview/server-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent 'http://127.0.0.1:4174/?workspace=map' > /dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent 'http://127.0.0.1:4174/?workspace=map' > /dev/null
          curl --fail --silent 'http://127.0.0.1:4174/assets/' > /dev/null || true
      - name: Upload owner preview
        uses: actions/upload-artifact@v4
        with:
          name: jure-map-owner-preview-${{ github.event.pull_request.head.sha }}
          path: owner-preview
          if-no-files-found: error
          retention-days: 7
