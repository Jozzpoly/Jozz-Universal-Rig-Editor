name: Checkpoint browser gate

on:
  push:
    branches:
      - 'checkpoint/**'
  pull_request:
    branches:
      - 'validation/donor-02f-base-2026-08-24'
      - 'validation/donor-03a-base-2026-08-24'
      - 'validation/donor-03b-owner-ready-base-2026-08-25'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: checkpoint-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node 24.16.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0

      - name: Match canonical npm
        run: npm install --global npm@11.17.0

      - name: Record toolchain
        run: |
          node --version
          npm --version

      - name: Install exact locked dependencies
        run: npm ci

      - name: Canonical JURE check
        run: npm run check

      - name: Prepare real-source Chrome probe
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No system Chrome/Chromium executable is available on this runner."
            exit 1
          fi
          echo "JURE_CHROME_EXECUTABLE=$CHROME" >> "$GITHUB_ENV"

          REAL_SOURCE="/tmp/OneSided_Steering_Suspension_Rig.gltf"
          curl -fsSL "https://raw.githubusercontent.com/Jozzpoly/Box3d_FunProject/959aefb78587ce60cf2b8eb03ff82797a4165142/assets/source/OneSided_Steering_Suspension_Rig.gltf" -o "$REAL_SOURCE"
          echo "57cda983f8f728bc819460540d2ee39b1b17288ecdac1f0dc8bb1a3e6f9ab750  $REAL_SOURCE" | sha256sum -c -
          test "$(wc -c < "$REAL_SOURCE")" -eq 64264
          echo "JURE_REAL_SOURCE_PATH=$REAL_SOURCE" >> "$GITHUB_ENV"
          echo "JURE_SOURCE_DATUM_NAME=Chassis_Top" >> "$GITHUB_ENV"

          npm install --no-save --package-lock=false playwright-core@1.60.0

      - name: Linux real-source construction frame probe
        run: node scripts/real-jv-wishbone-frame-probe.mjs

      - name: Linux exact-JV outboard grounding probe
        run: node scripts/real-jv-outboard-grounding-probe.mjs

      - name: Linux coherent neutral wishbone probe
        env:
          JURE_CANDIDATE_OUTPUT_PATH: ${{ runner.temp }}/CANDIDATE__real-jv-coherent-wishbone__NOT-AUTHORITY.json
        run: node scripts/real-jv-coherent-wishbone-probe.mjs

      - name: Linux coherent candidate file probe
        env:
          JURE_CANDIDATE_PROJECT_PATH: ${{ runner.temp }}/CANDIDATE__real-jv-coherent-wishbone__NOT-AUTHORITY.json
        run: node scripts/real-jv-coherent-wishbone-candidate-file-probe.mjs

      - name: Linux real-source revolute diagnostic probe
        run: node scripts/real-jv-revolute-diagnostic-probe.mjs

      - name: Linux exact-JV single-revolute TEST evaluator probe
        run: node scripts/real-jv-single-revolute-evaluator-probe.mjs

      - name: Linux browser owner interaction probes
        env:
          JURE_CANDIDATE_PROJECT_PATH: ${{ runner.temp }}/CANDIDATE__real-jv-coherent-wishbone__NOT-AUTHORITY.json
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 --strictPort >/tmp/jure-browser-vite.log 2>&1 &
          VITE_PID=$!
          cleanup() {
            status=$?
            trap - EXIT
            kill "$VITE_PID" 2>/dev/null || true
            echo "--- Vite browser-probe log ---"
            cat /tmp/jure-browser-vite.log || true
            exit "$status"
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 0.25
          done
          if [ "$ready" -ne 1 ]; then
            echo "Vite browser probe did not become ready."
            exit 1
          fi

          node scripts/browser-adoption-preview-lock-smoke.mjs
          node scripts/browser-construction-point-smoke.mjs
          node scripts/browser-construction-frame-authoring-smoke.mjs
          node scripts/browser-spherical-authoring-control-smoke.mjs
          node scripts/browser-owner-path-smoke.mjs
          node scripts/browser-coherent-candidate-owner-ready-smoke.mjs

      - name: Prepare frozen Owner physical mating package
        env:
          FROZEN_SHA: 53ce6cc31233cfe1b45d41081c7b58d4c8baa5c4
          FROZEN_TREE: 6dce314b3ed086998f03075a2b641be8a9988aea
          SOURCE_SHA256: 57cda983f8f728bc819460540d2ee39b1b17288ecdac1f0dc8bb1a3e6f9ab750
          CANDIDATE_PATH: ${{ runner.temp }}/CANDIDATE__real-jv-coherent-wishbone__NOT-AUTHORITY.json
        run: |
          set -euo pipefail
          PACKAGE="$RUNNER_TEMP/OWNER_MATING_GATE"
          mkdir -p "$PACKAGE"

          cp "$CANDIDATE_PATH" "$PACKAGE/CANDIDATE__real-jv-coherent-wishbone__NOT-AUTHORITY.json"
          cp "$JURE_REAL_SOURCE_PATH" "$PACKAGE/OneSided_Steering_Suspension_Rig.gltf"
          curl -fsSL "https://github.com/Jozzpoly/Jozz-Universal-Rig-Editor/archive/${FROZEN_SHA}.zip" \
            -o "$PACKAGE/JURE_FROZEN_${FROZEN_SHA}.zip"

          CANDIDATE_SHA256="$(sha256sum "$PACKAGE/CANDIDATE__real-jv-coherent-wishbone__NOT-AUTHORITY.json" | awk '{print $1}')"
          CANDIDATE_SIZE="$(wc -c < "$PACKAGE/CANDIDATE__real-jv-coherent-wishbone__NOT-AUTHORITY.json")"
          SOURCE_ACTUAL_SHA256="$(sha256sum "$PACKAGE/OneSided_Steering_Suspension_Rig.gltf" | awk '{print $1}')"
          SOURCE_SIZE="$(wc -c < "$PACKAGE/OneSided_Steering_Suspension_Rig.gltf")"
          APP_ARCHIVE_SHA256="$(sha256sum "$PACKAGE/JURE_FROZEN_${FROZEN_SHA}.zip" | awk '{print $1}')"

          test "$CANDIDATE_SIZE" -eq 20124
          test "$SOURCE_ACTUAL_SHA256" = "$SOURCE_SHA256"
          test "$SOURCE_SIZE" -eq 64264

          cat > "$PACKAGE/OWNER_MATING_MANIFEST.txt" <<EOF
          OWNER PHYSICAL MATING GATE PACKAGE
          ==================================
          Status: CANDIDATE / NOT PHYSICAL AUTHORITY
          Purpose: direct Owner inspection of upper/lower outboard wishbone-to-carrier mating candidates.

          Frozen JURE producer SHA: $FROZEN_SHA
          Frozen JURE product tree: $FROZEN_TREE
          Prior full validation run: 32846835489 (Linux + Windows + Owner-ready browser flow PASS)

          Candidate filename: CANDIDATE__real-jv-coherent-wishbone__NOT-AUTHORITY.json
          Candidate SHA-256: $CANDIDATE_SHA256
          Candidate bytes: $CANDIDATE_SIZE
          Candidate identity: project.real-jv-coherent-wishbone / rig.real-jv-coherent-wishbone
          Candidate topology: 4 elements / 8 frames / 4 relations / 11 exact SOURCE adoption receipts

          SOURCE filename: OneSided_Steering_Suspension_Rig.gltf
          SOURCE SHA-256: $SOURCE_ACTUAL_SHA256
          SOURCE bytes: $SOURCE_SIZE
          SOURCE revision: Jozzpoly/Box3d_FunProject@959aefb78587ce60cf2b8eb03ff82797a4165142

          Frozen JURE snapshot: JURE_FROZEN_${FROZEN_SHA}.zip
          Frozen JURE snapshot SHA-256: $APP_ARCHIVE_SHA256

          Semantic boundary:
          - Current X-min outboard positions are provenance-backed mating candidates only.
          - Zero relation residual is internal coherence, not physical correctness.
          - This package exists for Owner physical judgement; it is not a JV-Web consumer format.
          EOF

          cat > "$PACKAGE/OWNER_MATING_README.txt" <<'EOF'
          OWNER PHYSICAL MATING GATE — FIRST OBSERVATION
          =================================================
          1. Extract the frozen JURE snapshot and launch JURE normally (RUN_EDITOR.cmd on Windows).
          2. Open Project: CANDIDATE__real-jv-coherent-wishbone__NOT-AUTHORITY.json
          3. Open Source: OneSided_Steering_Suspension_Rig.gltf
          4. Before editing anything, inspect upper and lower outboard mating spatially from several camera angles.
          5. Do not interpret zero relation warnings as proof that the physical joint location is correct.
          6. Record the first judgement before correction: ACCEPT / WRONG / INCONCLUSIVE or a concrete visibility/selection/readability blocker.
          7. Only if the point looks wrong, attempt correction using normal JURE frame editing; do not edit JSON or use agent-provided coordinates.
          EOF

          (
            cd "$PACKAGE"
            sha256sum \
              CANDIDATE__real-jv-coherent-wishbone__NOT-AUTHORITY.json \
              OneSided_Steering_Suspension_Rig.gltf \
              "JURE_FROZEN_${FROZEN_SHA}.zip" \
              OWNER_MATING_MANIFEST.txt \
              OWNER_MATING_README.txt \
              > SHA256SUMS.txt
          )

          echo "OWNER_MATING_PACKAGE_PASS candidate_sha256=$CANDIDATE_SHA256 candidate_bytes=$CANDIDATE_SIZE source_sha256=$SOURCE_ACTUAL_SHA256"

      - name: Upload frozen Owner physical mating package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OWNER_MATING_GATE__53ce6cc3__${{ github.run_id }}
          path: ${{ runner.temp }}/OWNER_MATING_GATE
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

  windows-browser:
    needs: linux-browser
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node 24.16.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0

      - name: Match canonical npm
        run: npm install --global npm@11.17.0

      - name: Install exact locked dependencies
        run: npm ci

      - name: Canonical JURE check
        run: npm run check

      - name: Prepare Windows Chrome real-source probe
        shell: pwsh
        run: |
          $programFilesX86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $candidates = @(
            (Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'),
            $(if ($programFilesX86) { Join-Path $programFilesX86 'Google\Chrome\Application\chrome.exe' }),
            (Join-Path $env:LOCALAPPDATA 'Google\Chrome\Application\chrome.exe')
          ) | Where-Object { $_ -and (Test-Path $_) }
          $chrome = $candidates | Select-Object -First 1
          if (-not $chrome) { throw 'No installed Google Chrome executable found on windows-latest.' }
          "JURE_CHROME_EXECUTABLE=$chrome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $source = Join-Path $env:RUNNER_TEMP 'OneSided_Steering_Suspension_Rig.gltf'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/Jozzpoly/Box3d_FunProject/959aefb78587ce60cf2b8eb03ff82797a4165142/assets/source/OneSided_Steering_Suspension_Rig.gltf' -OutFile $source
          $hash = (Get-FileHash -Algorithm SHA256 -Path $source).Hash.ToLowerInvariant()
          if ($hash -ne '57cda983f8f728bc819460540d2ee39b1b17288ecdac1f0dc8bb1a3e6f9ab750') { throw "Unexpected SOURCE SHA-256: $hash" }
          if ((Get-Item $source).Length -ne 64264) { throw "Unexpected SOURCE size: $((Get-Item $source).Length)" }
          "JURE_REAL_SOURCE_PATH=$source" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'JURE_SOURCE_DATUM_NAME=Chassis_Top' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          npm install --no-save --package-lock=false playwright-core@1.60.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Windows real-source construction frame probe
        shell: pwsh
        run: |
          node scripts/real-jv-wishbone-frame-probe.mjs
          if ($LASTEXITCODE -ne 0) { throw "Windows construction-frame probe exited with code $LASTEXITCODE" }

      - name: Windows exact-JV outboard grounding probe
        shell: pwsh
        run: |
          node scripts/real-jv-outboard-grounding-probe.mjs
          if ($LASTEXITCODE -ne 0) { throw "Windows outboard grounding probe exited with code $LASTEXITCODE" }

      - name: Windows coherent neutral wishbone probe
        env:
          JURE_CANDIDATE_OUTPUT_PATH: ${{ runner.temp }}/CANDIDATE__real-jv-coherent-wishbone__NOT-AUTHORITY.json
        shell: pwsh
        run: |
          node scripts/real-jv-coherent-wishbone-probe.mjs
          if ($LASTEXITCODE -ne 0) { throw "Windows coherent wishbone probe exited with code $LASTEXITCODE" }

      - name: Windows coherent candidate file probe
        env:
          JURE_CANDIDATE_PROJECT_PATH: ${{ runner.temp }}/CANDIDATE__real-jv-coherent-wishbone__NOT-AUTHORITY.json
        shell: pwsh
        run: |
          node scripts/real-jv-coherent-wishbone-candidate-file-probe.mjs
          if ($LASTEXITCODE -ne 0) { throw "Windows coherent candidate file probe exited with code $LASTEXITCODE" }

      - name: Windows real-source revolute diagnostic probe
        shell: pwsh
        run: |
          node scripts/real-jv-revolute-diagnostic-probe.mjs
          if ($LASTEXITCODE -ne 0) { throw "Windows revolute diagnostic probe exited with code $LASTEXITCODE" }

      - name: Windows exact-JV single-revolute TEST evaluator probe
        shell: pwsh
        run: |
          node scripts/real-jv-single-revolute-evaluator-probe.mjs
          if ($LASTEXITCODE -ne 0) { throw "Windows single-revolute TEST evaluator probe exited with code $LASTEXITCODE" }

      - name: Windows browser owner interaction probes
        env:
          JURE_CANDIDATE_PROJECT_PATH: ${{ runner.temp }}/CANDIDATE__real-jv-coherent-wishbone__NOT-AUTHORITY.json
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'jure-browser-vite.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'jure-browser-vite.stderr.log'
          $vite = Start-Process -FilePath 'npm.cmd' -ArgumentList @('run','dev','--','--host','127.0.0.1','--port','4173','--strictPort') -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:4173/' -UseBasicParsing -TimeoutSec 1
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
              Start-Sleep -Milliseconds 250
            }
            if (-not $ready) { throw 'Vite browser probe did not become ready on Windows.' }

            node scripts/browser-adoption-preview-lock-smoke.mjs
            if ($LASTEXITCODE -ne 0) { throw "Windows adoption-preview lock probe exited with code $LASTEXITCODE" }
            node scripts/browser-construction-point-smoke.mjs
            if ($LASTEXITCODE -ne 0) { throw "Windows construction-point probe exited with code $LASTEXITCODE" }
            node scripts/browser-construction-frame-authoring-smoke.mjs
            if ($LASTEXITCODE -ne 0) { throw "Windows construction-frame authoring probe exited with code $LASTEXITCODE" }
            node scripts/browser-spherical-authoring-control-smoke.mjs
            if ($LASTEXITCODE -ne 0) { throw "Windows spherical authoring control probe exited with code $LASTEXITCODE" }
            node scripts/browser-owner-path-smoke.mjs
            if ($LASTEXITCODE -ne 0) { throw "Windows owner-path probe exited with code $LASTEXITCODE" }
            node scripts/browser-coherent-candidate-owner-ready-smoke.mjs
            if ($LASTEXITCODE -ne 0) { throw "Windows coherent candidate Owner-ready probe exited with code $LASTEXITCODE" }
          } finally {
            Stop-Process -Id $vite.Id -Force -ErrorAction SilentlyContinue
            Write-Host '--- Windows Vite stdout ---'
            if (Test-Path $stdout) { Get-Content $stdout }
            Write-Host '--- Windows Vite stderr ---'
            if (Test-Path $stderr) { Get-Content $stderr }
          }

  checkpoint-status:
    if: ${{ always() }}
    needs:
      - linux-browser
      - windows-browser
    runs-on: ubuntu-latest
    steps:
      - name: Publish observable checkpoint verdict
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          LINUX_RESULT: ${{ needs.linux-browser.result }}
          WINDOWS_RESULT: ${{ needs.windows-browser.result }}
        run: |
          if [ "$LINUX_RESULT" = "success" ] && [ "$WINDOWS_RESULT" = "success" ]; then
            STATE="success"
            DESCRIPTION="Linux and Windows checkpoint gates passed"
          else
            STATE="failure"
            DESCRIPTION="Checkpoint gate failed: linux=$LINUX_RESULT windows=$WINDOWS_RESULT"
          fi
          export STATE DESCRIPTION

          python - <<'PY' > /tmp/checkpoint-status.json
          import json, os
          print(json.dumps({
              "state": os.environ["STATE"],
              "description": os.environ["DESCRIPTION"][:140],
              "context": "jure/checkpoint-browser",
          }))
          PY

          curl -fsS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/$COMMIT_SHA" \
            --data-binary @/tmp/checkpoint-status.json

          test "$STATE" = "success"
