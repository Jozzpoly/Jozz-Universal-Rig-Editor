name: One-shot lockfile bootstrap

on:
  push:
    branches:
      - work/real-use-foundation-recovery
    paths:
      - '.github/workflows/lockfile-bootstrap.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work/real-use-foundation-recovery

      - name: Use Node 24.16.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0

      - name: Match canonical npm
        run: npm install --global npm@11.17.0

      - name: Generate canonical package-lock only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit generated lockfile
        run: |
          test -f package-lock.json
          git config user.name "JURE lockfile bootstrap"
          git config user.email "100104127+Jozzpoly@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already matches canonical resolution."
            exit 0
          fi
          git commit -m "build: pin canonical npm dependency graph"
          git push origin HEAD:work/real-use-foundation-recovery
