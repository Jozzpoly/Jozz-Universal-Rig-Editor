name: Recovery check

on:
  push:
    branches:
      - work/real-use-foundation-recovery

permissions:
  contents: read

concurrency:
  group: recovery-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node 24.16.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0

      - name: Match owner npm
        run: npm install --global npm@11.17.0

      - name: Record toolchain
        run: |
          node --version
          npm --version

      - name: Install project dependencies
        run: npm install

      - name: Canonical JURE check
        run: npm run check

      - name: Prepare browser owner-path probe
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No system Chrome/Chromium executable is available on this runner."
            exit 1
          fi
          echo "Browser probe executable: $CHROME"
          echo "JURE_CHROME_EXECUTABLE=$CHROME" >> "$GITHUB_ENV"
          npm install --no-save --package-lock=false playwright-core@1.60.0

      - name: Browser adopted-frame transform probe
        continue-on-error: true
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 --strictPort >/tmp/jure-browser-vite.log 2>&1 &
          VITE_PID=$!
          cleanup() {
            status=$?
            trap - EXIT
            kill "$VITE_PID" 2>/dev/null || true
            echo "--- Vite browser-probe log ---"
            cat /tmp/jure-browser-vite.log || true
            exit "$status"
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 0.25
          done
          if [ "$ready" -ne 1 ]; then
            echo "Vite browser probe did not become ready."
            exit 1
          fi

          node scripts/browser-owner-path-smoke.mjs
