name: Work check

on:
  push:
    branches:
      - main
      - 'work/**'
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: work-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node 24.16.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0

      - name: Match canonical npm
        run: npm install --global npm@11.17.0

      - name: Record toolchain
        run: |
          node --version
          npm --version

      - name: Install exact locked dependencies
        run: npm ci

      - name: Canonical JURE check
        run: npm run check
